<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SecondSelf Graph</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #020617; color: #e2e8f0; }
    #wrap { display: flex; height: 100vh; }
    #graph { flex: 1; background: radial-gradient(circle at top, #0f172a 0%, #020617 100%); position: relative; overflow: hidden; }
    #graph svg { width: 100%; height: 100%; cursor: grab; }
    #graph svg.dragging { cursor: grabbing; }
    #info { width: 340px; padding: 16px; box-sizing: border-box; border-left: 1px solid #334155; background: #111827; overflow: auto; }
    h1 { margin-top: 0; font-size: 20px; }
    .small { color: #94a3b8; font-size: 12px; line-height: 1.5; }
    .controls { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
    button, select { padding: 8px 10px; border-radius: 8px; border: 1px solid #475569; background: #1f2937; color: #f8fafc; }
    button:hover { cursor: pointer; background: #334155; }
    .pill { display: inline-block; padding: 4px 8px; border-radius: 999px; background: #1d4ed8; color: white; font-size: 12px; margin-right: 6px; margin-top: 6px; }
    .legend { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0 16px; }
    .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #cbd5e1; }
    .dot { width: 10px; height: 10px; border-radius: 999px; }
    pre { white-space: pre-wrap; word-break: break-word; background: #1f2937; padding: 10px; border-radius: 8px; }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="graph"></div>
    <div id="info">
      <h1>SecondSelf Knowledge Graph</h1>
      <div id="summary" class="small"></div>
      <div class="controls">
        <select id="filterGroup">
          <option value="all">All groups</option>
          <option value="Projects">Projects</option>
          <option value="Areas">Areas</option>
          <option value="Resources">Resources</option>
          <option value="Archives">Archives</option>
        </select>
        <button id="refreshBtn">Refresh</button>
        <button id="pulseBtn">Toggle pulse</button>
      </div>
      <div class="legend">
        <div class="legend-item"><span class="dot" style="background:#3b82f6"></span>Projects</div>
        <div class="legend-item"><span class="dot" style="background:#10b981"></span>Areas</div>
        <div class="legend-item"><span class="dot" style="background:#f59e0b"></span>Resources</div>
        <div class="legend-item"><span class="dot" style="background:#ef4444"></span>Archives</div>
      </div>
      <div id="details"></div>
    </div>
  </div>

  <script>
    const colorMap = {
      Projects: '#3b82f6',
      Areas: '#10b981',
      Resources: '#f59e0b',
      Archives: '#ef4444'
    };

    const graphHost = document.getElementById('graph');
    const details = document.getElementById('details');
    const summary = document.getElementById('summary');

    let state = {
      nodes: [],
      edges: [],
      nodesById: {},
      scale: 1,
      tx: 0,
      ty: 0,
      dragNode: null,
      selectedNodeId: null,
      pulseEnabled: true,
      activeFilter: 'all'
    };

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function createSvgElement(tag, attrs = {}) {
      const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
      Object.entries(attrs).forEach(([key, value]) => el.setAttribute(key, value));
      return el;
    }

    function buildGraphLayout(graphData) {
      const width = 1200;
      const height = 800;
      const nodes = graphData.nodes.map((node, index) => ({
        ...node,
        x: 400 + (index % 8) * 120 + Math.random() * 80,
        y: 120 + Math.floor(index / 8) * 100 + Math.random() * 40,
        vx: 0,
        vy: 0,
        visible: true,
        radius: 12
      }));
      const nodesById = Object.fromEntries(nodes.map(node => [node.id, node]));
      const edges = graphData.edges.map(edge => ({ ...edge, visible: true }));

      for (let step = 0; step < 120; step += 1) {
        nodes.forEach(node => {
          node.vx *= 0.85;
          node.vy *= 0.85;
        });

        for (let i = 0; i < nodes.length; i += 1) {
          for (let j = i + 1; j < nodes.length; j += 1) {
            const a = nodes[i];
            const b = nodes[j];
            const dx = b.x - a.x;
            const dy = b.y - a.y;
            const distance = Math.hypot(dx, dy) || 1;
            const force = 2800 / (distance * distance);
            const fx = (dx / distance) * force;
            const fy = (dy / distance) * force;
            a.vx -= fx;
            a.vy -= fy;
            b.vx += fx;
            b.vy += fy;
          }
        }

        edges.forEach(edge => {
          const source = nodesById[edge.source];
          const target = nodesById[edge.target];
          if (!source || !target) return;
          const dx = target.x - source.x;
          const dy = target.y - source.y;
          const distance = Math.hypot(dx, dy) || 1;
          const force = 0.016;
          source.vx += (dx / distance) * force * 180;
          source.vy += (dy / distance) * force * 180;
          target.vx -= (dx / distance) * force * 180;
          target.vy -= (dy / distance) * force * 180;
        });

        nodes.forEach(node => {
          node.x += node.vx;
          node.y += node.vy;
          node.x = clamp(node.x, 80, width - 80);
          node.y = clamp(node.y, 80, height - 80);
        });
      }

      return { nodes, edges, nodesById };
    }

    function updateFilter() {
      const selected = state.activeFilter;
      state.nodes.forEach(node => {
        node.visible = selected === 'all' || node.para === selected;
      });
      state.edges.forEach(edge => {
        const source = state.nodesById[edge.source];
        const target = state.nodesById[edge.target];
        edge.visible = !!(source && target && source.visible && target.visible);
      });
      render();
    }

    function render() {
      const svg = graphHost.querySelector('svg');
      if (!svg) return;
      svg.innerHTML = '';
      const group = createSvgElement('g', { transform: `translate(${state.tx}, ${state.ty}) scale(${state.scale})` });
      svg.appendChild(group);

      const edgeLayer = createSvgElement('g');
      group.appendChild(edgeLayer);
      state.edges.forEach(edge => {
        if (!edge.visible) return;
        const source = state.nodesById[edge.source];
        const target = state.nodesById[edge.target];
        if (!source || !target) return;
        const line = createSvgElement('line', {
          x1: source.x,
          y1: source.y,
          x2: target.x,
          y2: target.y,
          stroke: '#475569',
          'stroke-width': 1.2,
          'stroke-linecap': 'round',
          opacity: 0.55
        });
        edgeLayer.appendChild(line);
      });

      const nodeLayer = createSvgElement('g');
      group.appendChild(nodeLayer);
      state.nodes.forEach(node => {
        if (!node.visible) return;
        const pulse = state.pulseEnabled ? 2 * Math.abs(Math.sin(Date.now() / 380 + node.id.length / 10)) : 0;
        const radius = node.radius + pulse;
        const circle = createSvgElement('circle', {
          cx: node.x,
          cy: node.y,
          r: radius,
          fill: colorMap[node.para] || '#64748b',
          stroke: '#f8fafc',
          'stroke-width': node.id === state.selectedNodeId ? 3 : 1.5,
          opacity: 0.9
        });
        circle.addEventListener('mouseenter', () => {
          state.selectedNodeId = node.id;
          render();
          details.innerHTML = `
            <h3>${node.label}</h3>
            <div class="pill">${node.para}</div>
            ${node.tags.map(tag => `<span class="pill">${tag}</span>`).join('')}
            <h4>Summary</h4>
            <pre>${node.summary || '(none)'}</pre>
            <h4>Preview</h4>
            <pre>${node.content_preview || '(none)'}</pre>
          `;
        });
        circle.addEventListener('mouseleave', () => {
          if (state.selectedNodeId === node.id) {
            state.selectedNodeId = null;
            render();
          }
        });
        circle.addEventListener('mousedown', (event) => {
          event.stopPropagation();
          state.dragNode = node;
          svg.classList.add('dragging');
        });
        nodeLayer.appendChild(circle);

        const text = createSvgElement('text', {
          x: node.x + radius + 6,
          y: node.y + 4,
          fill: '#f8fafc',
          'font-size': '12',
          'font-family': 'Arial'
        });
        text.textContent = node.label.length > 24 ? `${node.label.slice(0, 23)}…` : node.label;
        nodeLayer.appendChild(text);
      });
    }

    function renderGraph(graphData) {
      const layout = buildGraphLayout(graphData);
      state.nodes = layout.nodes;
      state.edges = layout.edges;
      state.nodesById = layout.nodesById;
      state.scale = 1;
      state.tx = 0;
      state.ty = 0;
      state.selectedNodeId = null;
      summary.innerHTML = `Nodes: ${graphData.nodes.length} &nbsp;|&nbsp; Edges: ${graphData.edges.length} &nbsp;|&nbsp; Generated: ${graphData.metadata.generated_at}`;
      details.innerHTML = '<div class="small">Hover a node to preview it, drag to reposition it, and use the mouse wheel to zoom.</div>';
      updateFilter();
      requestAnimationFrame(() => {
        render();
      });
    }

    function resetView() {
      state.scale = 1;
      state.tx = 0;
      state.ty = 0;
      render();
    }

    function attachEvents() {
      const svg = createSvgElement('svg', { viewBox: '0 0 1200 800' });
      graphHost.appendChild(svg);

      svg.addEventListener('mousemove', (event) => {
        if (!state.dragNode) return;
        const rect = svg.getBoundingClientRect();
        const x = ((event.clientX - rect.left) / rect.width) * 1200;
        const y = ((event.clientY - rect.top) / rect.height) * 800;
        state.dragNode.x = x - state.tx;
        state.dragNode.y = y - state.ty;
        render();
      });

      svg.addEventListener('mouseup', () => {
        state.dragNode = null;
        svg.classList.remove('dragging');
      });
      svg.addEventListener('mouseleave', () => {
        state.dragNode = null;
        svg.classList.remove('dragging');
      });
      svg.addEventListener('wheel', (event) => {
        event.preventDefault();
        const delta = event.deltaY < 0 ? 1.08 : 0.92;
        state.scale = clamp(state.scale * delta, 0.5, 2.2);
        render();
      }, { passive: false });

      document.getElementById('refreshBtn').addEventListener('click', () => loadGraph());
      document.getElementById('pulseBtn').addEventListener('click', () => {
        state.pulseEnabled = !state.pulseEnabled;
        render();
        document.getElementById('pulseBtn').textContent = state.pulseEnabled ? 'Toggle pulse' : 'Enable pulse';
      });
      document.getElementById('filterGroup').addEventListener('change', (event) => {
        state.activeFilter = event.target.value;
        updateFilter();
      });
    }

    async function loadGraph() {
      const response = await fetch('../data/graph.json');
      if (!response.ok) {
        throw new Error('graph.json could not be loaded');
      }
      const graphData = await response.json();
      renderGraph(graphData);
    }

    attachEvents();
    loadGraph().catch(err => {
      details.innerHTML = `<pre>${err}</pre>`;
    });
  </script>
</body>
</html>
